# Daily node fetcher
# 每天自动抓取最新的免费节点

name: Daily Node Fetch

on:
  schedule:
    # 每天 UTC 12:00 (北京时间 20:00) 运行
    # 网站通常在北京时间 18:00-20:00 更新
    - cron: '0 12 * * *'
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write

jobs:
  fetch-nodes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch nodes
        run: |
          python3 fetch_nodes.py nodes

      - name: Check if files were updated
        id: check
        run: |
          if [ -f "nodes/clash.yaml" ] || [ -f "nodes/v2ray.txt" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "Node files updated successfully"
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "No node files created"
          fi

      - name: Commit and push
        if: steps.check.outputs.found == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nodes/
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            TODAY=$(date -u +%Y-%m-%d)
            git commit -m "Update nodes for ${TODAY}"
            git push
          fi
